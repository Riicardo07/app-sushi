<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sushi-app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Sushisom Battle</h1>
        
        <div class="counters">
            <!-- Contador 1 -->
            <div class="card">
                <img src="fotos/sushi.jpg" alt="Sushi">
                <h3>Piezas Sushi</h3>
                <p id="count-sushi" class="number">0</p>
                <button onclick="controller.increment('sushi')">¡Comer!</button>
            </div>

            <!-- Contador 2 -->
            <div class="card">
                <img src="fotos/panbao.jpg" alt="Otros">
                <h3>Otras Piezas</h3>
                <p id="count-others" class="number">0</p>
                <button onclick="controller.increment('others')">¡Comer!</button>
            </div>
        </div>

        <div class="actions">
            <button id="btn-finish" class="finish-btn" onclick="controller.finishGame()">Terminar y Comparar</button>
        </div>

        <!-- Modal de Resultado -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <h2>Resultado Final</h2>
                <div id="result-summary"></div>
                <hr>
                <div class="input-group">
                    <label>¿Cuántas piezas comió tu chiwi?</label>
                    <input type="number" id="rival-score" min="0" placeholder="Ej: 15">
                    <button onclick="controller.compare()">Ver Ganador</button>
                </div>
                <p id="winner-message" class="winner-msg"></p>
                <button class="close-btn" onclick="location.reload()">Reiniciar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
